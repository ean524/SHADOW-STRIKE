<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>SHADOW-STRIKE</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070b;
  font-family:Arial,sans-serif;
  color:white;
  touch-action:none;
}
canvas{
  display:block;
  width:100%;
  height:100%;
  background:linear-gradient(#101827,#06080d);
}
#hud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  font-size:18px;
  pointer-events:none;
}
#health{
  color:#38ff75;
}
#controls{
  position:fixed;
  bottom:25px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:0 25px;
  pointer-events:none;
}
button{
  pointer-events:auto;
  width:75px;
  height:75px;
  border-radius:50%;
  border:2px solid #aaa;
  background:#151b25dd;
  color:white;
  font-size:28px;
}
#fire{
  width:90px;
  height:90px;
  background:#b51d1d;
  border-color:#ff6565;
}
#message{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#000b;
  text-align:center;
}
#message h1{
  font-size:42px;
  margin:0 0 10px;
}
#start{
  width:180px;
  height:55px;
  border-radius:12px;
  font-size:18px;
}
.hidden{display:none!important}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="health">❤️ 100</div>
  <div>🎯 Puntos: <span id="score">0</span></div>
  <div>🔫 Munición: <span id="ammo">30</span></div>
</div>

<div id="controls">
  <button id="left">◀</button>
  <button id="fire">🔥</button>
  <button id="right">▶</button>
</div>

<div id="message">
  <h1>SHADOW-STRIKE</h1>
  <p>Apunta. Dispara. Sobrevive.</p>
  <button id="start">JUGAR</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let player;
let enemies=[];
let bullets=[];
let score=0;
let ammo=30;
let health=100;
let playing=false;
let moving=0;
let lastSpawn=0;

function reset(){
  player={
    x:W/2,
    y:H-130,
    w:42,
    h:60,
    speed:5
  };

  enemies=[];
  bullets=[];
  score=0;
  ammo=30;
  health=100;
  updateHUD();
}

function updateHUD(){
  document.getElementById("score").textContent=score;
  document.getElementById("ammo").textContent=ammo;
  document.getElementById("health").textContent="❤️ "+health;
}

function drawBackground(){
  ctx.fillStyle="#080b11";
  ctx.fillRect(0,0,W,H);

  // suelo
  ctx.fillStyle="#151a21";
  ctx.fillRect(0,H*0.65,W,H);

  // líneas del mapa
  ctx.strokeStyle="#252d38";
  ctx.lineWidth=2;

  for(let y=H*0.65;y<H;y+=45){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  for(let x=-W;x<W*2;x+=100){
    ctx.beginPath();
    ctx.moveTo(W/2,H*0.65);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  // edificios
  ctx.fillStyle="#111722";
  ctx.fillRect(30,H*.25,110,H*.4);
  ctx.fillRect(W-150,H*.18,120,H*.47);
  ctx.fillRect(W*.38,H*.32,100,H*.33);
}

function drawPlayer(){
  ctx.save();
  ctx.translate(player.x,player.y);

  // cuerpo
  ctx.fillStyle="#263b4f";
  ctx.fillRect(-20,-5,40,45);

  // cabeza
  ctx.fillStyle="#c98e6a";
  ctx.beginPath();
  ctx.arc(0,-20,14,0,Math.PI*2);
  ctx.fill();

  // casco
  ctx.fillStyle="#202933";
  ctx.fillRect(-15,-33,30,10);

  // arma
  ctx.fillStyle="#090b0e";
  ctx.fillRect(12,0,32,7);

  ctx.restore();
}

function drawEnemy(e){
  ctx.save();
  ctx.translate(e.x,e.y);

  ctx.fillStyle="#7d2222";
  ctx.fillRect(-18,-3,36,38);

  ctx.fillStyle="#b96f52";
  ctx.beginPath();
  ctx.arc(0,-18,13,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#1b1111";
  ctx.fillRect(-14,-30,28,9);

  ctx.fillStyle="#08090b";
  ctx.fillRect(-38,4,22,6);

  ctx.restore();
}

function shoot(){
  if(!playing || ammo<=0)return;

  ammo--;

  bullets.push({
    x:player.x+35,
    y:player.y,
    speed:12
  });

  updateHUD();

  if(ammo===0){
    setTimeout(()=>ammo=30,1000);
  }
}

function spawnEnemy(){
  enemies.push({
    x:30+Math.random()*(W-60),
    y:-50,
    speed:1.3+Math.random()*1.8,
    hp:1
  });
}

function update(){
  if(!playing)return;

  player.x+=moving*player.speed;

  if(player.x<35)player.x=35;
  if(player.x>W-35)player.x=W-35;

  for(const b of bullets){
    b.x+=b.speed;
  }

  for(const e of enemies){
    e.y+=e.speed;
  }

  // impactos
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];

    for(let j=bullets.length-1;j>=0;j--){
      const b=bullets[j];

      if(
        Math.abs(b.x-e.x)<35 &&
        Math.abs(b.y-e.y)<40
      ){
        enemies.splice(i,1);
        bullets.splice(j,1);
        score+=10;
        updateHUD();
        break;
      }
    }

    if(e.y>H-70){
      enemies.splice(i,1);
      health-=20;
      updateHUD();

      if(health<=0){
        gameOver();
      }
    }
  }

  bullets=bullets.filter(b=>b.x<W+50);

  if(Date.now()-lastSpawn>1000){
    spawnEnemy();
    lastSpawn=Date.now();
  }
}

function draw(){
  drawBackground();

  for(const b of bullets){
    ctx.fillStyle="#ffd84a";
    ctx.fillRect(b.x,b.y,18,5);
  }

  for(const e of enemies){
    drawEnemy(e);
  }

  if(player)drawPlayer();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

function startGame(){
  reset();
  playing=true;
  document.getElementById("message").classList.add("hidden");
}

function gameOver(){
  playing=false;
  document.querySelector("#message h1").textContent="GAME OVER";
  document.querySelector("#message p").textContent=
    "Puntuación: "+score;
  document.getElementById("start").textContent="JUGAR DE NUEVO";
  document.getElementById("message").classList.remove("hidden");
}

document.getElementById("start").onclick=startGame;

document.getElementById("fire").addEventListener("pointerdown",e=>{
  e.preventDefault();
  shoot();
});

document.getElementById("left").addEventListener("pointerdown",()=>{
  moving=-1;
});

document.getElementById("right").addEventListener("pointerdown",()=>{
  moving=1;
});

addEventListener("pointerup",()=>{
  moving=0;
});

reset();
loop();
</script>

</body>
</html>
